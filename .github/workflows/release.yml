name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag (e.g. v1.1.0) to attach artifacts to. Required for workflow_dispatch."
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.rid }} / ${{ matrix.project }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            project: RemoteCmd.Client
            archive: zip
          - os: windows-latest
            rid: win-x64
            project: RemoteCmd.Server
            archive: zip
          - os: ubuntu-latest
            rid: linux-x64
            project: RemoteCmd.Client
            archive: tar.gz
          - os: ubuntu-latest
            rid: linux-x64
            project: RemoteCmd.Server
            archive: tar.gz
          - os: macos-latest
            rid: osx-arm64
            project: RemoteCmd.Client
            archive: tar.gz
          - os: macos-latest
            rid: osx-arm64
            project: RemoteCmd.Server
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Publish
        shell: bash
        run: |
          dotnet publish ${{ matrix.project }} \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o publish/${{ matrix.project }}-${{ matrix.rid }}

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "publish/${{ matrix.project }}-${{ matrix.rid }}/*" -DestinationPath "${{ matrix.project }}-${{ matrix.rid }}.zip"

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          cd publish/${{ matrix.project }}-${{ matrix.rid }}
          tar -czvf ../../${{ matrix.project }}-${{ matrix.rid }}.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-${{ matrix.rid }}
          path: ${{ matrix.project }}-${{ matrix.rid }}.*
          retention-days: 14

  package-mcp:
    name: Package MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps + pack
        working-directory: mcp-server
        run: |
          npm install --no-audit --no-fund
          npm pack
          mv *.tgz ../remote-cmd-mcp.tgz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: remote-cmd-mcp
          path: remote-cmd-mcp.tgz
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: [build, package-mcp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten
        run: |
          mkdir -p release
          find dist -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.tgz" \) -exec cp -v {} release/ \;
          ls -la release/

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: RemoteCmd ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: release/*
          draft: false
          prerelease: false
