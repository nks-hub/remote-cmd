name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag (e.g. v1.1.0) to attach artifacts to. Required for workflow_dispatch."
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.rid }} / ${{ matrix.project }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            project: RemoteCmd.Client
            archive: zip
          - os: windows-latest
            rid: win-x64
            project: RemoteCmd.Server
            archive: zip
          - os: ubuntu-latest
            rid: linux-x64
            project: RemoteCmd.Client
            archive: tar.gz
          - os: ubuntu-latest
            rid: linux-x64
            project: RemoteCmd.Server
            archive: tar.gz
          - os: macos-latest
            rid: osx-arm64
            project: RemoteCmd.Client
            archive: tar.gz
          - os: macos-latest
            rid: osx-arm64
            project: RemoteCmd.Server
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Publish
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "Stamping version: $VERSION"
          dotnet publish ${{ matrix.project }} \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version="$VERSION" \
            -o publish/${{ matrix.project }}-${{ matrix.rid }}

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "publish/${{ matrix.project }}-${{ matrix.rid }}/*" -DestinationPath "${{ matrix.project }}-${{ matrix.rid }}.zip"

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          cd publish/${{ matrix.project }}-${{ matrix.rid }}
          tar -czvf ../../${{ matrix.project }}-${{ matrix.rid }}.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-${{ matrix.rid }}
          path: ${{ matrix.project }}-${{ matrix.rid }}.*
          retention-days: 14

  client48:
    name: Build Client48 (.NET Framework 4.8)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          dotnet build RemoteCmd.Client48/RemoteCmd.Client48.csproj -c Release -p:Version="$VERSION"

      - name: Package (zip)
        shell: pwsh
        run: |
          Compress-Archive -Path "RemoteCmd.Client48/bin/Release/*" -DestinationPath "RemoteCmd.Client48-win-net48.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteCmd.Client48-win-net48
          path: RemoteCmd.Client48-win-net48.zip
          retention-days: 14

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk RemoteCmd-android-debug.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteCmd-android-debug
          path: RemoteCmd-android-debug.apk
          retention-days: 14

  package-mcp:
    name: Package MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps + pack
        working-directory: mcp-server
        run: |
          npm install --no-audit --no-fund
          npm pack
          mv *.tgz ../remote-cmd-mcp.tgz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: remote-cmd-mcp
          path: remote-cmd-mcp.tgz
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: [build, client48, android, package-mcp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten
        run: |
          mkdir -p release
          find dist -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.tgz" -o -name "*.apk" \) -exec cp -v {} release/ \;
          ls -la release/

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: RemoteCmd ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: release/*
          draft: false
          prerelease: false
